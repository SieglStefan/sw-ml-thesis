[general]
created = 2026-08-10T23:40:32.858Z
julia = "1.10.11"
name = "zscore_OBLW_365"
seed = 3
sw_vers = "0.21.1+DEV"

[grid]
grid_type = "OctahedralGaussianGrid"
nlayers = 8
trunc = 31

[io]
forms = ["affine: dT = a + b*P(T)", "olw = c + d*P(T[nlayers÷2]) + e*P(Ts)", "slwd = f + g*P(T[nlayers])", "P = identity (linear) or x^4 (planck)"]
groups = ["direct", "linear", "planck"]
inputs = ["T", "q", "p", "lat", "lf", "sst", "lst", "Ts"]
keys = ["DirectOutput: dT, olw, slwd", "LinearOutput: a, b, c, d, e, f, g", "PlanckOutput: a, b, c, d, e, f, g"]

[model]
co2 = 280.0
em_land = 0.9800000190734863
em_ocean = 0.9800000190734863
model = "PrimitiveWetModel"
scheme = "OneBandLongwave"
transmissivity = "FriersonLongwaveTransmissivity"

[perturbation]
fac_pert_q = 0.20000000298023224
fac_pert_t = 2.0

[sampling]
n_ic = 3
sample_gap = 3.65
sim_time = 365
start_date = "2000-01-01T00:00:00"
t_spinup = "365 days"

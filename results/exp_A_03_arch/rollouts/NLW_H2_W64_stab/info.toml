[general]
created = 2026-08-12T21:15:17.079Z
experiment = "exp_A_03_arch"
julia = "1.10.10"
name = "NLW_H2_W64_stab"
sw_vers = "0.21.1+DEV"

[grid]
grid_type = "OctahedralGaussianGrid"
nlayers = 8
trunc = 31

[lw_scheme]
act = "tanh"
def_co2 = 280.0
def_land_em = 0.9800000190734863
def_ocean_em = 0.9800000190734863
inputs = ["T", "sst", "lst", "lf", "lat", "p"]
n_hidden = 2
n_in = 13
n_out = 21
output_form = "PlanckOutput"
scheme = "NeuralLW"
width = 64
zscore_stats = "zscore_OBLW_default"

[rollout]
em_land = 0.9800000190734863
em_ocean = 0.9800000190734863
metrics = ["rmse", "bias", "maxdiff", "mean"]
model = "PrimitiveWetModel"
probes = ["T", "olw", "slwd"]
reference = "OBLW_default"

[sampling]
heatmap_days = [30, 90, 180, 365]
heatmap_traj = 1
max_horizon = 365
n_traj = 4
rollout_t = 365
start_days = [0, 91, 182, 274]
